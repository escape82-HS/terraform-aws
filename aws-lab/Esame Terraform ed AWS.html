    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        let html = '';
        
        questions.forEach((q, index) => {
            html += `<div class="question-block" id="block-${index}">
                <div class="question-title">${index + 1}. ${q.q}</div>
                <ul class="options">`;
            
            q.options.forEach((opt, optIndex) => {
                html += `<li>
                    <label>
                        <input type="radio" name="q${index}" value="${optIndex}">
                        ${opt}
                    </label>
                </li>`;
            });

            html += `</ul>
                <div class="explanation" id="exp-${index}">
                    <strong>Spiegazione:</strong> ${q.explanation}
                </div>
            </div>`;
        });

        container.innerHTML = html;
    }

    function submitQuiz() {
        let score = 0;
        let answered = 0;

        questions.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const expDiv = document.getElementById(`exp-${index}`);
            const blockDiv = document.getElementById(`block-${index}`);
            
            // Reset styles
            expDiv.style.display = 'block';
            expDiv.className = 'explanation';

            if (selected) {
                answered++;
                const val = parseInt(selected.value);
                if (val === q.answer) {
                    score++;
                    expDiv.classList.add('correct-ans');
                    expDiv.innerHTML = `<strong>Corretto!</strong> ${q.explanation}`;
                } else {
                    expDiv.classList.add('wrong-ans');
                    expDiv.innerHTML = `<strong>Sbagliato.</strong> La risposta corretta era: <em>${q.options[q.answer]}</em>.<br><br><strong>Spiegazione:</strong> ${q.explanation}`;
                }
            } else {
                expDiv.classList.add('wrong-ans');
                expDiv.innerHTML = `<strong>Non risposto.</strong> La risposta corretta era: <em>${q.options[q.answer]}</em>.<br><br><strong>Spiegazione:</strong> ${q.explanation}`;
            }
        });

        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        
        const percentage = ((score / questions.length) * 100).toFixed(2);
        let message = "";
        if (percentage >= 80) message = "Ottimo lavoro! Sei pronto per la certificazione.";
        else if (percentage >= 60) message = "Buon risultato, ma c'è margine di miglioramento.";
        else message = "Ti consigliamo di ripassare le slide del corso.";

        resultsDiv.innerHTML = `Hai risposto correttamente a ${score} domande su ${questions.length} (${percentage}%).<br><span style="font-size:0.8em; font-weight:normal;">${message}</span>`;
        
        // Scroll to top to see results
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize
    window.onload = renderQuiz;
